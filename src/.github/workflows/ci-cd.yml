name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/herasymchuk-registry
  COMMUNICATION_CONTROL_IMAGE: communication-control
  MAPCLIENT_IMAGE: mapclient

jobs:
  backend-test-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./CommunicationControl

      - name: Run backend tests
        run: dotnet test --no-restore --verbosity normal
        working-directory: ./CommunicationControl

      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DO_REGISTRY_USERNAME }}
          password: ${{ secrets.DO_REGISTRY_PASSWORD }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./CommunicationControl
          file: ./CommunicationControl/CommunicationControl.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.COMMUNICATION_CONTROL_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}

  frontend-test-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./MapClient

      - name: Run frontend tests
        run: npm test
        working-directory: ./MapClient

      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DO_REGISTRY_USERNAME }}
          password: ${{ secrets.DO_REGISTRY_PASSWORD }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./MapClient
          file: ./MapClient/MapClient.Dockerfile
          build-args: |
            VITE_API_BASE_URL=http://${{ github.ref_name == 'main' && 'prod' || 'dev' }}-communication-control:8080
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.MAPCLIENT_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: csharp,javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  deploy:
    needs: [backend-test-build-push, frontend-test-build-push, codeql-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ github.ref_name == 'main' && '5095f169-aa1a-47fb-b64b-7ec7d3e1061b' || '6d55edc2-3078-429a-bda7-0bc49e9a1886' }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/communication-control communication-control=${{ env.REGISTRY }}/${{ env.COMMUNICATION_CONTROL_IMAGE }}:${{ github.sha }}
          kubectl set image deployment/mapclient mapclient=${{ env.REGISTRY }}/${{ env.MAPCLIENT_IMAGE }}:${{ github.sha }}
          kubectl rollout status deployment/communication-control
          kubectl rollout status deployment/mapclient