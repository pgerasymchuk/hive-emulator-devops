apiVersion: v1
kind: Service
metadata:
  name: mapclient
spec:
  type: LoadBalancer
  selector:
    app: mapclient
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapclient
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mapclient
  template:
    metadata:
      labels:
        app: mapclient
    spec:
      imagePullSecrets:
        - name: do-registry
      containers:
        - name: mapclient
          image: registry.digitalocean.com/herasymchuk-registry/mapclient
          ports:
            - containerPort: 80
